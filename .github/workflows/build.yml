name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Prepare the local NuGet consumer before solution restore
        run: dotnet msbuild Tests/PackageCompatibilitySmoke/Prepare.proj -nologo -v:minimal
      - run: dotnet restore DubboNet.sln
      - run: dotnet build DubboNet.sln --configuration Release --no-restore -p:GeneratePackageOnBuild=false
      - run: dotnet test Tests/UnitTestForDubboNet/UnitTestForDubboNet.csproj --configuration Release --no-build --no-restore -p:GeneratePackageOnBuild=false
      - name: Run the full unit suite against the Standard DLL on .NET 8 and 10
        run: dotnet test Tests/UnitTestForDubboNet/UnitTestForDubboNet.csproj --configuration Release -p:DubboNetTestTargetFramework=netstandard2.0 -p:GeneratePackageOnBuild=false
      - name: Exercise the prepared real NuGet consumers
        shell: bash
        run: |
          dotnet run --project Tests/PackageCompatibilitySmoke/PackageCompatibilitySmoke.csproj -c Release -f net8.0 --no-restore -- net8.0
          dotnet run --project Tests/PackageCompatibilitySmoke/PackageCompatibilitySmoke.csproj -c Release -f net10.0 --no-restore -- net10.0
      - name: Build the portable integration-test container
        run: docker build -f Tests/DubboClientIntegrationTests/Dockerfile -t dubbonet-integration:ci .
      - name: Check container defaults without network access
        run: docker run --rm --network none dubbonet-integration:ci --print-config

  framework-package-smoke:
    # API compatibility is not equivalent to full registry compatibility. This
    # Windows job checks actual Framework execution of Native and Triple only.
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Prepare the local NuGet consumer
        run: dotnet msbuild Tests/PackageCompatibilitySmoke/Prepare.proj -nologo -v:minimal
      - run: dotnet build Tests/PackageCompatibilitySmoke/PackageCompatibilitySmoke.csproj -c Release -f net48 --no-restore
      - name: Run the Standard NuGet asset on .NET Framework 4.8
        run: |
          & ./Tests/PackageCompatibilitySmoke/bin/Release/net48/PackageCompatibilitySmoke.exe netstandard2.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
