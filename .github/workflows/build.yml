name: Build and test

on:
  push:
    branches: [main, codex/import-dubbonet-history]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Compatibility baseline only; supported-LTS migration is tracked in #5.
          dotnet-version: '6.0.x'
      - run: dotnet restore DubboNet.sln
      - run: dotnet build DubboNet.sln --configuration Release --no-restore -p:GeneratePackageOnBuild=false
      - run: dotnet test Tests/UnitTestForDubboNet/UnitTestForDubboNet.csproj --configuration Release --no-build --no-restore -p:GeneratePackageOnBuild=false
