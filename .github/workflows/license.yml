name: License header audit

# Manual audit while provenance and inherited headers are being settled in #2.
# Enable automatic PR enforcement only after that review; this is not a passing
# compliance gate or a substitute for the SGA/ICLA process.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-header-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0
        with:
          mode: check
          token: ''
